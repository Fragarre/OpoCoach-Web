name: Update Empleo status model

on:
  push:
    paths:
      - '.github/workflows/update-empleo-inscripcion.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update employment submodule
        shell: bash
        run: |
          cd backend/employment_service
          git fetch origin main
          git checkout 1afd7a8494072edca05a216e0fac52bcad9b420b
          cd ../..
          git add backend/employment_service
      - name: Patch Empleo frontend
        shell: bash
        run: |
          python -c "import base64;exec(base64.b64decode(''))"
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/employment_service frontend/app/empleo/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Separar inscripción y ciclo selectivo en Empleo"
          git push
