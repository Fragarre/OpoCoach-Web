name: Fix home account loading

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-home-account-loading.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply targeted loading-state fix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/fix_home_loading.py
          python /tmp/fix_home_loading.py

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- frontend/app/page.tsx; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/page.tsx
          git commit -m "Corregir carga de usuario y suscripción en inicio"
          git push origin main
