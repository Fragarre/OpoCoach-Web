name: Ajustar filtro inscripción

on:
  push:
    paths:
      - '.github/workflows/ajustar-filtro-inscripcion.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar interfaz
        shell: python
        run: |
          from pathlib import Path
          p = Path('frontend/app/empleo/page.tsx')
          s = p.read_text(encoding='utf-8')

          old = ' const procesosFiltrados=soloInscripcionAbierta?procesos.filter(p=>p.estado_inscripcion==="ABIERTO"):procesos;\n const resumenMunicipios=ayuntamientos.map(o=>{const lista=procesosTodos.filter(p=>p.organismo_id===o.id);return{organismo:o,nombre:o.municipio||o.nombre.replace(/^Ayuntamiento de\\s+/i,"").trim(),oportunidades:lista.length,plazas:plazasTotales(lista)}}).filter(x=>x.oportunidades>0).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));'
          new = ' const procesosFiltrados=soloInscripcionAbierta&&seleccion?.tipo!=="AYUNTAMIENTO"?procesos.filter(p=>p.estado_inscripcion==="ABIERTO"):procesos;\n const procesosAyuntamientosVista=soloInscripcionAbierta?procesosAyuntamientos.filter(p=>p.estado_inscripcion==="ABIERTO"):procesosAyuntamientos;\n const resumenMunicipios=ayuntamientos.map(o=>{const lista=procesosAyuntamientosVista.filter(p=>p.organismo_id===o.id);return{organismo:o,nombre:o.municipio||o.nombre.replace(/^Ayuntamiento de\\s+/i,"").trim(),oportunidades:lista.length,plazas:plazasTotales(lista)}}).filter(x=>x.oportunidades>0).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));\n const selectorInscripcion=<div style={{display:"inline-flex",gap:4,marginTop:12,padding:3,border:"1px solid #d7deea",borderRadius:9,background:"#f7f9fc"}}><button type="button" onClick={()=>setSoloInscripcionAbierta(false)} style={{border:0,borderRadius:7,padding:"7px 12px",cursor:"pointer",fontWeight:700,background:!soloInscripcionAbierta?"#172238":"transparent",color:!soloInscripcionAbierta?"white":"#475569"}}>Todas</button><button type="button" onClick={()=>setSoloInscripcionAbierta(true)} style={{border:0,borderRadius:7,padding:"7px 12px",cursor:"pointer",fontWeight:700,background:soloInscripcionAbierta?"#172238":"transparent",color:soloInscripcionAbierta?"white":"#475569"}}>Inscripción abierta</button></div>;'
          assert old in s
          s = s.replace(old, new)

          old = '<p style={styles.muted}>{procesosAyuntamientos.length} oportunidades · {plazasTotales(procesosAyuntamientos)} plazas</p></div></div>{resumenMunicipios.length===0?<p>No hay oportunidades municipales activas.</p>'
          new = '<p style={styles.muted}>{procesosAyuntamientosVista.length} oportunidades · {plazasTotales(procesosAyuntamientosVista)} plazas</p>{selectorInscripcion}</div></div>{resumenMunicipios.length===0?<p>{soloInscripcionAbierta?"No hay ayuntamientos con convocatorias de inscripción abierta.":"No hay oportunidades municipales activas."}</p>'
          assert old in s
          s = s.replace(old, new)

          old = '<p style={styles.muted}>{procesos.length} oportunidades · {plazasTotales(procesos)} plazas</p><label style={{display:"inline-flex",alignItems:"center",gap:8,marginTop:10,fontSize:14,fontWeight:700,cursor:"pointer"}}><input type="checkbox" checked={soloInscripcionAbierta} onChange={e=>setSoloInscripcionAbierta(e.target.checked)}/> Puedo inscribirme ahora</label></div></div>'
          new = '<p style={styles.muted}>{procesosFiltrados.length} oportunidades · {plazasTotales(procesosFiltrados)} plazas</p>{seleccion?.tipo!=="AYUNTAMIENTO"&&selectorInscripcion}</div></div>'
          assert old in s
          s = s.replace(old, new)

          p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/app/empleo/page.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Mover filtro de inscripción al nivel de organismo"
          git push
